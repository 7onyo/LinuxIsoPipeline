name: Build and Release Custom Debian Trixie ISO

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for manual release (e.g., v1.0.1)'
        required: true
        default: 'v1.0.1-manual'

permissions:
  contents: write 

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO in Docker Privileged Container
        run: |
         docker run --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie \
            bash build.sh

      - name: Create GitHub Release and Upload ISO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.release_tag }}
          generate_release_notes: true
          files: live-image-amd64.hybrid.iso
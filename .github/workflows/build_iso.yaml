name: Build and Release Custom Debian Trixie ISO

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for manual release'
        required: true
        default: 'manual-release'

permissions:
  contents: write 

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO in Docker Privileged Container
        run: |
         docker run --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie \
            bash build.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          generate_release_notes: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Upload ISO to R2
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          FILE_TO_UPLOAD: live-image-amd64.hybrid.iso
        run: python3 upload.py
